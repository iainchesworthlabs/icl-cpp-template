name: CodeQL

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@83968a97205d35fbb49b1bdb85a35ca397b1e4ff # v0.1.4-test
    with:
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-release", "vcpkg": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]

name: CodeQL

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@91679aa5dcc903ad7028dcf0938cc323635ae605 # v0.1.2
    with:
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-release", "vcpkg": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]

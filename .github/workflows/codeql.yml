name: CodeQL

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    permissions:
      security-events: write
      contents: read
      issues: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/codeql.yml@6a7b2e79336c7d4d1c0528a02e48258c0be920fd # v0.1.1
    with:
      languages: >-
        [
          {"language": "cpp", "build_mode": "manual", "preset": "linux-release", "vcpkg": true},
          {"language": "python", "build_mode": "none"},
          {"language": "actions", "build_mode": "none"}
        ]

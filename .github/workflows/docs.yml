name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@91679aa5dcc903ad7028dcf0938cc323635ae605 # v0.1.2

  deploy:
    name: Deploy site
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@91679aa5dcc903ad7028dcf0938cc323635ae605 # v0.1.2
    with:
      deploy: true

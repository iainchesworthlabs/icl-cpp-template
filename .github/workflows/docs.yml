name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@6a7b2e79336c7d4d1c0528a02e48258c0be920fd # v0.1.1

  deploy:
    name: Deploy site
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@6a7b2e79336c7d4d1c0528a02e48258c0be920fd # v0.1.1
    with:
      deploy: true

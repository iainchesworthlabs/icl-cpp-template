name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@1c6ccad42956ff561bf5443d6e7683db4f1491d1 # v0.1.0

  deploy:
    name: Deploy site
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@1c6ccad42956ff561bf5443d6e7683db4f1491d1 # v0.1.0
    with:
      deploy: true
